[versions]
agp = "7.4.2"
kotlin-plugin = "1.7.22"
retrofit = "2.6.0"
appcompat = "1.1.0"
constraintlayout = "2.1.0"
material = "1.1.0"
okhttp = "3.12.1"
easyrecyclerview = "4.4.2"
multidex = "2.0.0"
adapter = "2.9.30"
smartrefresh = "1.1.3"
room = "2.3.0"
markdown4j = "2.2-cj-1.1"
kotlin = "1.4.32"
ktx = "1.6.0"
coroutines = "1.5.0"
viewmodel = "2.4.0-alpha02"
livedata = "2.4.0-alpha02"
lifecycle = "2.4.0-alpha02"
koin = "3.1.2"
fastjson = "1.2.76"
